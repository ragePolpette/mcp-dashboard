[project]
name = "mcp-dashboard"
version = "0.3.0"
description = "Local control plane for running and observing a workstation-scale MCP stack."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["backend", "modules/local_secret_vault/src", "tests"]
extend-exclude = ["runtime"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "local_secret_vault"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
